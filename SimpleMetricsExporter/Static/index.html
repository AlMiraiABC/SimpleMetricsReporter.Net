<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Metrics Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="dashboard.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>
    <script src="parser.js"></script>
    <script src="dashboard.js" defer></script>
</head>
<body>
    <nav class="navbar navbar-dark bg-dark mb-4">
        <div class="container-fluid px-4">
            <span class="navbar-brand">Simple Metrics Dashboard</span>
        </div>
    </nav>

    <main class="container-fluid px-4 pb-5">
        <section class="card metric-card mb-4">
            <div class="card-body">
                <div class="d-flex flex-wrap align-items-center justify-content-between gap-2 mb-3">
                    <div>
                        <h1 class="h4 mb-1">指标数据</h1>
                    </div>
                </div>
                <div class="row g-2 mb-3">
                    <div class="col-6 col-lg-auto">
                        <button id="startPolling" class="btn btn-success w-100">开始每秒刷新</button>
                    </div>
                    <div class="col-6 col-lg-auto">
                        <button id="stopPolling" class="btn btn-outline-danger w-100" disabled>停止刷新</button>
                    </div>
                </div>
                <div id="status" class="small text-secondary mt-2">暂无数据...</div>
            </div>
        </section>

        <section class="row g-3 mb-4" id="summaryCards"></section>

        <section class="row g-4 mb-4">
            <div class="col-12 col-xl-4">
                <div class="card chart-card h-100">
                    <div class="card-body">
                        <h2 class="h6">指标类型分布</h2>
                        <div id="typeChart" class="chart"></div>
                    </div>
                </div>
            </div>
            <div class="col-12 col-xl-8">
                <div class="card chart-card h-100">
                    <div class="card-body">
                        <h2 class="h6">指标总览</h2>
                        <div id="overviewChart" class="chart"></div>
                    </div>
                </div>
            </div>
        </section>

        <section>
            <div class="d-flex align-items-center justify-content-between mb-3">
                <h2 class="h5 mb-0">按指标类型匹配的可视化</h2>
                <span id="metricCount" class="badge text-bg-secondary"></span>
            </div>
            <div id="metricCharts" class="row g-4"></div>
        </section>

        <section class="card chart-card mt-4">
            <div class="card-body">
                <div class="row g-4">
                    <div class="col-12 col-xxl-6">
                        <h2 class="h6">Prometheus 文本</h2>
                        <pre id="sourceText" class="output bg-light rounded p-3 mb-0" placeholder="暂无原始文本..." readonly></pre>
                    </div>
                    <div class="col-12 col-xxl-6">
                        <h2 class="h6">解析后的 JSON</h2>
                        <pre id="jsonOutput" class="output bg-light rounded p-3 mb-0">暂未解析...</pre>
                    </div>
                </div>
            </div>
        </section>
    </main>

</body>
</html>
